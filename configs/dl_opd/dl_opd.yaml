# DL-OPD master config (plan §15.2). Paths relative to repo root unless absolute.

out: ckpts/dl_opd/mask_opd

student:
  plm_model: student/Qwen2.5-VL-3B
  sam_ckpt: ckpts/stage2_phase2mix/ConVerSeg_stage2_final.torch
  plm_ckpt: ckpts/stage2_phase2mix/ConVerSeg_stage2_plm_final.torch
  lora: ckpts/stage2_phase2mix/lora_plm_adapter_final
  head_ckpt: null  # optional MaskStateEncoder init

teacher:
  plm_model: teacher/Qwen2.5-VL-7B
  base_sam: teacher/sam2_hiera_large.pt
  sam_ckpt: ckpts/teacher_correction/teacher7b/CorrectionTeacher_7B_final.torch
  plm_ckpt: ckpts/teacher_correction/teacher7b/CorrectionTeacher_7B_plm_final.torch
  lora: ckpts/teacher_correction/teacher7b/lora_plm_adapter_final
  head_ckpt: ckpts/teacher_correction/teacher7b/CorrectionTeacher_7B_head_final.torch

data:
  data_dir: data
  dataset_jsonl: phase2/phase2_mixed.jsonl
  batch_composition:
    base: 0.25
    conv_pos: 0.25
    conv_neg: 0.20
    hard: 0.30

train:
  device: cuda
  max_dim: 1024
  batch_size: 1
  acc: 6
  steps: 2000
  lr: 2.0e-5
  wd: 0.05
  seed: 1337
  workers: 2
  log_every: 20
  save_every: 1000
  state_source: current  # current | random | historical

gate:
  tau_hi: 0.85
  delta: 0.02
  conf_hard: 0.55
  conf_soft: 0.35
  consistency_min: 0.70
  enable_dual_teacher: false
  enable_identity_on_high_iou: true

loss:
  lambda_opd: 1.0
  lambda_bd: 0.5
  lambda_rep: 0.0
  lambda_col: 0.0
  lambda_anc: 0.2
  lambda_dice: 1.0
  empty_bce_weight: 3.0
  temperature: 2.0
  identity_weight: 0.5

cache:
  enabled: true
  ttl_epochs: 2

schedule:
  n_outer: 4
  lambda_col_schedule: [0.0, 0.0, 0.25, 0.5]

data_policy:
  diag_jsonl: data/dl_opd/diag_manifest.jsonl
  diag_bootstrap_n: 64
  ttl_cycles: 2
  max_ops: 2
  gen_parents: 32
  max_per_image: 2
  min_concept_prob: 0.05
